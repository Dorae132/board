  const STORE = 'page-password';
  const form = document.getElementById('form');
  const message = document.getElementById('message');
  const bytes = text => Uint8Array.from(atob(text), ch => ch.charCodeAt(0));

  async function decrypt(password) {
    const salt = bytes(PAYLOAD.salt), iv = bytes(PAYLOAD.iv), mac = bytes(PAYLOAD.mac), data = bytes(PAYLOAD.data);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const keys = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PAYLOAD.iterations, hash: 'SHA-256' }, base, 512));
    const macKey = await crypto.subtle.importKey('raw', keys.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const signed = new Uint8Array(iv.length + data.length);
    signed.set(iv);
    signed.set(data, iv.length);
    if (!await crypto.subtle.verify('HMAC', macKey, mac, signed)) return null;
    const aesKey = await crypto.subtle.importKey('raw', keys.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, data));
  }

  async function open(password, remember) {
    message.textContent = '';
    const html = await decrypt(password);
    if (html == null) return false;
    try {
      if (remember) localStorage.setItem(STORE, password);
    } catch (err) { /* 存不了就下次再输 */ }
    document.open();
    document.write(html);
    document.close();
    return true;
  }

  if (!window.crypto || !crypto.subtle) {
    message.textContent = '这个浏览器或打开方式不支持解密，请用 https 网址在 Safari 或 Chrome 里打开。';
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const ok = await open(document.getElementById('password').value, document.getElementById('remember').checked).catch(() => false);
    if (!ok) message.textContent = '密码不对';
  });
  // 这台设备记住过密码就直接打开；密码改过了就清掉，重新输
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (err) { saved = null; }
  if (saved) {
    open(saved, false).then(ok => { if (!ok) localStorage.removeItem(STORE); }).catch(() => {});
  }
})();
